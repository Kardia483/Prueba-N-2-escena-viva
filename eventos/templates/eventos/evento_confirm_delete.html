{% extends "base.html" %}

{% block title %}Borrar evento — Escena Viva{% endblock %}

{% block content %}

    <section class="card auth">
        <h2>¿Borrar "{{ object.titulo }}"?</h2>
        <p>Esta acción no se puede deshacer.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn-solid">Sí, borrar</button>
            <a href="{% url 'evento_detail' object.pk %}" class="btn-outline">Cancelar</a>
        </form>
    </section>

{% endblock %}

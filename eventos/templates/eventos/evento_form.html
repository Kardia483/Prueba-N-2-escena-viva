{% extends "base.html" %}

{% block title %}{% if object %}Editar evento{% else %}Nuevo evento{% endif %} — Escena Viva{% endblock %}

{% block content %}

    <section class="card auth">
        <h2>{% if object %}Editar evento{% else %}Nuevo evento{% endif %}</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-solid">Guardar</button>
        </form>
    </section>

{% endblock %}
